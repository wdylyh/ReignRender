# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.4.0
group=com.wdylyh

# Dependencies
fabric_api_version=0.141.6+1.21.11
malilib_version=0.27.16

# ---- Fabric Loom 相关镜像 ----
# com.mojang:* 库只在 libraries.minecraft.net 发布，阿里云没有，
# 使用 BMCLAPI 镜像（国内可访问，完整镜像 Mojang libraries/assets/manifest）
loom_libraries_base=https://bmclapi2.bangbang93.com/maven/
loom_resources_base=https://bmclapi2.bangbang93.com/assets/
loom_version_manifests=https://bmclapi2.bangbang93.com/mc/game/version_manifest.json
loom_experimental_versions=https://maven.fabricmc.net/net/minecraft/experimental_versions.json
loom_fabric_repository=https://maven.fabricmc.net/
